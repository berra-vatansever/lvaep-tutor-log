<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LVAEP Tutor Log</title>
<meta name="description" content="Log tutoring sessions and generate monthly attendance & achievement reports for Literacy Volunteers of America, Essex/Passaic County.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">LV</span>
    <div>
      <div class="brand-name">Tutor Log</div>
      <div class="brand-sub">Literacy Volunteers of America · Essex/Passaic</div>
    </div>
  </div>
  <div class="top-right">
    <nav class="role-switch" aria-label="Choose view" hidden>
      <button type="button" id="role-tutor" data-role="tutor">Tutor view</button>
      <button type="button" id="role-staff" data-role="staff">Staff</button>
    </nav>
    <div id="account" class="account" hidden></div>
  </div>
</header>

<main id="app" class="wrap">
  <p class="loading">Loading…</p>
</main>

<dialog id="goals-dialog" class="dialog"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<footer class="foot wrap">
  90 Broad Street, Bloomfield, NJ 07003 · info@lvaep.org · (973) 566-6200 x216
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
